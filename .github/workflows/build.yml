name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unduh core PPSSPP dan aset sistem
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets core_tmp
          curl -fL -o core.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/ppsspp_libretro_android.so.zip
          unzip -o core.zip -d core_tmp
          mv core_tmp/ppsspp_libretro_android.so app/src/main/jniLibs/arm64-v8a/libppsspp_core.so
          curl -fL -o app/src/main/assets/PPSSPP.zip https://buildbot.libretro.com/assets/system/PPSSPP.zip
      - name: Build
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MC3-PSP-APK
          path: app/build/outputs/apk/release/app-release.apk
